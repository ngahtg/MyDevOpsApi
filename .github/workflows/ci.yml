name: .NET Core CI & Docker CD

# Thiết lập điều kiện kích hoạt: chạy khi có push hoặc tạo Pull Request vào nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Kéo toàn bộ mã nguồn từ GitHub về ổ đĩa của máy ảo
    - name: Checkout repository
      uses: actions/checkout@v4

    # Bước 2: Cài đặt bộ SDK .NET 8 vào máy ảo
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Bước 3: Tải thư viện phụ thuộc trực tiếp cho file .csproj
    - name: Restore dependencies
      run: dotnet restore ./MyDevOpsApi/MyDevOpsApi.csproj

    # Bước 4: Biên dịch code C# trực tiếp từ file .csproj
    - name: Build project
      run: dotnet build ./MyDevOpsApi/MyDevOpsApi.csproj --no-restore --configuration Release

    # Bước 5: Đăng nhập vào Docker Hub bằng tài khoản lưu trong GitHub Secrets
    - name: Log in to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Bước 6: Đóng gói Docker Image và tự động đẩy (Push) lên Docker Hub
    - name: Build and Push Docker Image
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: ./MyDevOpsApi
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/mydevopsapi:latest